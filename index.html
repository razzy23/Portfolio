<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rav — Portfolio</title>
<meta name="description" content="Rav's portfolio: UI/UX, web development, graphic design and video editing.">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Sarpanch:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-tool="move">

<div class="boot" id="boot" aria-hidden="true">
  <div class="boot-card">
    <b>Rav.fig</b>
    <span class="boot-bar"><i></i></span>
    <small>loading frames…</small>
  </div>
</div>

<header class="topbar">
  <a class="logo" id="logo" href="#" aria-label="Rav — home">
    <svg viewBox="0 0 60 60" fill="currentColor" aria-hidden="true"><path d="M56.8488 24.4345C56.8488 27.5298 55.9766 30.2877 54.2322 32.7083C52.5076 35.129 50.2577 36.875 47.4825 37.9464L56.8488 50H43.9739L35.9456 38.869H15.2208V50H3V22.2208C3 15.4714 8.47144 10 15.2208 10H42.4277C45.084 10 47.5024 10.6548 49.6829 11.9643C51.8634 13.254 53.5979 14.9901 54.8864 17.1726C56.1947 19.3552 56.8488 21.7758 56.8488 24.4345ZM19.2208 18.869C17.0117 18.869 15.2208 20.6599 15.2208 22.869V30H27.1591H39.0975C40.6238 30 41.9222 29.4544 42.9926 28.3631C44.0829 27.2718 44.628 25.9623 44.628 24.4345C44.628 22.9067 44.0829 21.5972 42.9926 20.506C41.9222 19.4147 40.6238 18.869 39.0975 18.869H19.2208Z"/></svg>
  </a>
  <nav class="nav" aria-label="Main">
    <a href="#about" data-open="about">about</a>
    <a href="#work" data-open="work">my work</a>
    <a href="#contact" data-open="contact">contact</a>
  </nav>
</header>

<main class="stage" id="stage">
  <div class="hero" id="hero">
    <div class="arch"></div>
    <img class="photo" src="assets/rav.png" alt="Rav holding a microphone and smiling" draggable="false">
  </div>

  <button class="folder f-uiux" data-cat="uiux" style="--f-bg:#CFA8FF;--f-line:#A66BFF;--i:0">
    <span class="f-inner"><span class="f-tab"></span><span class="f-paper"></span><span class="f-body"></span><span class="f-label">UI/UX</span></span>
  </button>
  <button class="folder f-web" data-cat="web" style="--f-bg:#FF9AD0;--f-line:#F23C9E;--i:1">
    <span class="f-inner"><span class="f-tab"></span><span class="f-paper"></span><span class="f-body"></span><span class="f-label">Web</span></span>
  </button>
  <button class="folder f-graphics" data-cat="graphics" style="--f-bg:#7BE6F5;--f-line:#12C4DD;--i:2">
    <span class="f-inner"><span class="f-tab"></span><span class="f-paper"></span><span class="f-body"></span><span class="f-label">Graphics</span></span>
  </button>
  <button class="folder f-video" data-cat="video" style="--f-bg:#7BF0B5;--f-line:#1ED47A;--i:3">
    <span class="f-inner"><span class="f-tab"></span><span class="f-paper"></span><span class="f-body"></span><span class="f-label">Video</span></span>
  </button>

  <div class="rav-tag" data-tip="drag me" aria-hidden="true"><svg viewBox="0 0 30 29"><path d="M19.241 14.2809L27.8131 11.3182C28.9603 10.9217 28.9312 9.28928 27.7706 8.93395L2.88267 1.31424C1.81923 0.988654 0.889727 2.10587 1.40332 3.09234L13.4708 26.2708C14.0055 27.298 15.5279 27.1133 15.8015 25.988L18.4321 15.1697C18.5329 14.7551 18.8377 14.4202 19.241 14.2809Z" stroke-width="2.5" stroke-linejoin="round"/></svg><span class="pill">RAV</span></div>

  <div class="sticky s1" style="--r:-4deg;--bg:#FFC7E6"><p>hi 👋 i'm rav.<br>this site is kind of a game.<br>click things. drag things.</p><span class="by">— rav</span></div>
  <div class="sticky s2" style="--r:3deg;--bg:#BDF3F8"><p>psst. press <kbd>/</kbd> for quick actions.<br>there are <b>9</b> secrets here.</p><span class="by">— also rav</span></div>
</main>

<svg class="ink" id="ink" aria-hidden="true"></svg>
<div class="tool-layer" id="toolLayer"></div>
<div class="windows" id="windows"></div>

<div class="pointer" id="pointer" aria-hidden="true"><svg viewBox="0 0 30 29"><path d="M19.241 14.2809L27.8131 11.3182C28.9603 10.9217 28.9312 9.28928 27.7706 8.93395L2.88267 1.31424C1.81923 0.988654 0.889727 2.10587 1.40332 3.09234L13.4708 26.2708C14.0055 27.298 15.5279 27.1133 15.8015 25.988L18.4321 15.1697C18.5329 14.7551 18.8377 14.4202 19.241 14.2809Z" stroke-width="2.5" stroke-linejoin="round"/></svg><span class="pill"></span></div>

<button class="hud" id="hud" title="Achievements">
  <span class="lv">LV <b id="lvl">1</b></span>
  <span class="xpbar"><i id="xpfill"></i></span>
  <span class="hud-meta"><span id="xptxt">0/100 xp</span><span id="secrets">★ 0/9</span></span>
</button>

<div class="toolbar" role="toolbar" aria-label="Tools">
  <button class="tool is-on" data-tool="move" title="Move (V)" aria-label="Move tool">
    <svg viewBox="0 0 24 24"><path d="M5 3l13 7.2-5.6 1.6L9.6 17.6z" fill="currentColor"/></svg>
  </button>
  <button class="tool" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle tool">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5.5" width="16" height="13" rx="1"/></svg>
  </button>
  <button class="tool" data-tool="pen" title="Pen (P)" aria-label="Pen tool">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
  </button>
  <button class="tool" data-tool="comment" title="Comment (C)" aria-label="Comment tool">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 12a8 8 0 1 1 8 8H4z"/></svg>
  </button>
  <span class="sep"></span>
  <button class="swatch" id="swatch" title="Color" aria-label="Cycle color"><i></i></button>
  <button class="tool" id="paletteBtn" title="Quick actions (/)" aria-label="Quick actions">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
  </button>
</div>

<div class="dock">
  <button class="dock-btn" id="soundBtn" title="Sound" aria-label="Toggle sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
  </button>
  <button class="dock-btn" id="helpBtn" title="Shortcuts (?)" aria-label="Shortcuts">?</button>
</div>

<div class="palette-wrap" id="paletteWrap" hidden>
  <div class="palette" role="dialog" aria-label="Quick actions">
    <input id="paletteInput" type="text" placeholder="Search actions…" autocomplete="off" spellcheck="false">
    <ul id="paletteList" role="listbox"></ul>
    <div class="palette-foot"><span>↑↓ navigate</span><span>↵ run</span><span>esc close</span></div>
  </div>
</div>

<ul class="ctx" id="ctx" role="menu" hidden></ul>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

<noscript><p style="position:fixed;bottom:20px;left:20px;font-family:monospace">This portfolio is interactive — please enable JavaScript.</p></noscript>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
